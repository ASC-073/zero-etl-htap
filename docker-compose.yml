services:
  htap-postgres:
    build: .
    # Changing conf for postgres to add wal2json as an output_plugin_libraries entity.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "output_plugin_libraries=pgoutput,test_decoding,wal2json"
    container_name: htap_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=htap_db
    volumes:
      # This will save DB state across container restarts
      - ./pg_data:/var/lib/postgresql/data
      # This is shared folder where the NixOS host and Docker container can exchange files
      - ./shared_data:/tmp/shared_data
